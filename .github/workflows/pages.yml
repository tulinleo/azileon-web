# Test deployment of the site to GitHub Pages, independent of the production host.
# URL: https://tulinleo.github.io/azileon-web/
name: Pages preview

on:
  push:
    branches: [feature/projects-page]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /azileon-web/
      # SPA fallback: Pages serves 404.html for unknown paths such as /azileon-web/projects
      - run: cp dist/index.html dist/404.html
      # Keep the test copy out of search engines
      - run: |
          sed -i 's#<head>#<head><meta name="robots" content="noindex, nofollow" />#' dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
